<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="728" viewBox="0 0 1160 728" role="img" aria-labelledby="flowTitle flowDesc">
<title id="flowTitle">MOBILE-009 · Logout and company/account/origin boundaries clear affected intent</title>
<desc id="flowDesc">Arrows show the documented workflow. Denial and missing-prerequisite branches are red.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1160" height="100%" fill="#ffffff"/>
<text x="38" y="32" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#172033">MOBILE-009 · Logout and company/account/origin boundaries clear affected intent</text>
<text x="38" y="55" font-family="Arial,sans-serif" font-size="12" fill="#5e6b7d">Source-grounded flow | Current permission, version and original retry controls remain binding</text>
<path d="M 350 154 V 212" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 350 280 V 338" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 350 406 V 464" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 350 532 V 590" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<g><title>Create a fictional draft and selected capture in QA Alpha; delay a read/send response in the fixture.</title>
<rect x="70.0" y="86" width="560" height="68" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.8"/>
<text x="350" y="115.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Create a fictional draft and selected capture in QA Alpha; delay a</text>
<text x="350" y="134.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">read/send response in the fixture.</text>
</g>
<g><title>Switch company and deliver the old response; open the new company’s chats and publication forms.</title>
<rect x="70.0" y="212" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="241.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Switch company and deliver the old response; open the new</text>
<text x="350" y="260.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">company’s chats and publication forms.</text>
</g>
<g><title>Repeat with logout during network failure and with a new account/server sign-in.</title>
<rect x="70.0" y="338" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="367.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Repeat with logout during network failure and with a new</text>
<text x="350" y="386.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">account/server sign-in.</text>
</g>
<g><title>Return to the original authorized company and inspect drafts/captures.</title>
<rect x="70.0" y="464" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="493.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Return to the original authorized company and inspect</text>
<text x="350" y="512.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">drafts/captures.</text>
</g>
<g><title>Compare every expected result; record PASS, FAIL or BLOCKED for this run</title>
<rect x="70.0" y="590" width="560" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="619.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Compare every expected result; record PASS, FAIL or BLOCKED for</text>
<text x="350" y="638.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">this run</text>
