</g>
<g><title>Choose metric or attention category</title>
<polygon points="350,338 630.0,399.2 350,460.4 70.0,399.2" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
<text x="350" y="404.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Choose metric or attention category</text>
</g>
