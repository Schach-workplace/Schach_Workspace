<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1088.8" viewBox="0 0 1160 1088.8" role="img" aria-labelledby="flowTitle flowDesc">
<title id="flowTitle">Foreground private content and scoped RAM intent</title>
<desc id="flowDesc">Arrows show the documented workflow. Denial and missing-prerequisite branches are red.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1160" height="100%" fill="#ffffff"/>
<text x="38" y="32" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#172033">Foreground private content and scoped RAM intent</text>
<text x="38" y="55" font-family="Arial,sans-serif" font-size="12" fill="#5e6b7d">Source-grounded flow | Current permission, version and original retry controls remain binding</text>
<path d="M 350 154 V 212" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="178.0" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>route focus</title>route focus</text>
<path d="M 630.0 273.2 H 713 V 259.0 H 770.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="490.0" y="202" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>pending/denied</title>pending/denied</text>
<path d="M 350 334.4 V 392.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="358.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>authorized</title>authorized</text>
<path d="M 350 460.4 V 518.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="484.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>author input</title>author input</text>
<path d="M 350 586.4 V 644.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="610.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>navigate/background/change scope</title>navigate/background/change scope</text>
<path d="M 630.0 705.6 H 713 V 259.0 H 770.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="490.0" y="634.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>background hides fetched content</title>background hides fetched content</text>
<path d="M 350 766.8 V 824.8" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="790.8" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>same principal foreground</title>same principal foreground</text>
<path d="M 70.0 858.8 H 50 V 273.2 H 70.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="90" y="814.8" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>fresh checks</title>fresh checks</text>
<path d="M 70.0 705.6 H 20 V 984.8 H 70.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="90" y="634.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>logout/company/account/source withdrawal</title>logout/company/account/source withdrawal</text>
<path d="M 770.0 259.0 H 713 V 984.8 H 630.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="630.0" y="208" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>confirmed authority loss</title>confirmed authority loss</text>
<g><title>Member opens company-qualified native route</title>
<rect x="70.0" y="86" width="560" height="68" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.8"/>
<text x="350" y="125.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Member opens company-qualified native route</text>
</g>
<g><title>Client verifies current foreground authority</title>
<polygon points="350,212 630.0,273.2 350,334.4 70.0,273.2" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
<text x="350" y="278.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Client verifies current foreground authority</text>
</g>
<g><title>Client withholds fetched private content</title>
<rect x="770.0" y="218" width="340" height="82" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="1.8"/>
<text x="940" y="254.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Client withholds fetched private</text>
<text x="940" y="273.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">content</text>
</g>
<g><title>Member uses keyboard/44dp actions/Back</title>
<rect x="70.0" y="392.4" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="431.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Member uses keyboard/44dp actions/Back</text>
</g>
<g><title>Client keeps authored draft/frozen send in scoped RAM</title>
<rect x="70.0" y="518.4" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="557.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Client keeps authored draft/frozen send in scoped RAM</text>
</g>
<g><title>OS/navigation changes lifecycle</title>
<polygon points="350,644.4 630.0,705.6 350,766.8 70.0,705.6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
<text x="350" y="710.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">OS/navigation changes lifecycle</text>
</g>
<g><title>Client refetches current authorized content</title>
<rect x="70.0" y="824.8" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="863.8" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Client refetches current authorized content</text>
</g>
<g><title>Client clears affected input/captures on denial/boundary</title>
<rect x="70.0" y="950.8" width="560" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="989.8" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Client clears affected input/captures on denial/boundary</text>
</g>
</svg>
