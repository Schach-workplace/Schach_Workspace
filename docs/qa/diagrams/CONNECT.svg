<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1088.8" viewBox="0 0 1160 1088.8" role="img" aria-labelledby="flowTitle flowDesc">
<title id="flowTitle">Current conversation to structured or published work</title>
<desc id="flowDesc">Arrows show the documented workflow. Denial and missing-prerequisite branches are red.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1160" height="100%" fill="#ffffff"/>
<text x="38" y="32" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#172033">Current conversation to structured or published work</text>
<text x="38" y="55" font-family="Arial,sans-serif" font-size="12" fill="#5e6b7d">Source-grounded flow | Current permission, version and original retry controls remain binding</text>
<path d="M 350 154 V 212" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="178.0" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>open</title>open</text>
<path d="M 630.0 273.2 H 713 V 259.0 H 770.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="490.0" y="202" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>not authorized</title>not authorized</text>
<path d="M 350 334.4 V 392.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="358.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>authorized</title>authorized</text>
<path d="M 350 460.4 V 518.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="484.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>message actions</title>message actions</text>
<path d="M 350 640.8 V 698.8" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="664.8" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>ack/poll/event/decision</title>ack/poll/event/decision</text>
<path d="M 70.0 579.6 H 30 V 858.8 H 70.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="90" y="508.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>selected publication allowed</title>selected publication allowed</text>
<path d="M 350 892.8 V 950.8" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="916.8" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>current source/policy/assignment</title>current source/policy/assignment</text>
<path d="M 70.0 732.8 H 50 V 273.2 H 70.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="90" y="688.8" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>current reader check</title>current reader check</text>
<g><title>Member selects person or named conversation</title>
<rect x="70.0" y="86" width="560" height="68" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.8"/>
<text x="350" y="125.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Member selects person or named conversation</text>
</g>
<g><title>Server checks active company and private history scope</title>
<polygon points="350,212 630.0,273.2 350,334.4 70.0,273.2" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
<text x="350" y="278.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Server checks active company and private history scope</text>
</g>
<g><title>Server withholds private conversation</title>
<rect x="770.0" y="218" width="340" height="82" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="1.8"/>
<text x="940" y="254.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Server withholds private</text>
<text x="940" y="273.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">conversation</text>
</g>
<g><title>Member reads/searches/saves current history</title>
<rect x="70.0" y="392.4" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="431.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Member reads/searches/saves current history</text>
</g>
<g><title>Creator chooses a current source action</title>
<polygon points="350,518.4 630.0,579.6 350,640.8 70.0,579.6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
<text x="350" y="584.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Creator chooses a current source action</text>
</g>
<g><title>Creator fixes record recipients; reviewer responds</title>
<rect x="70.0" y="698.8" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="737.8" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Creator fixes record recipients; reviewer responds</text>
</g>
<g><title>Publisher reviews selected work audience</title>
<rect x="70.0" y="824.8" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="863.8" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Publisher reviews selected work audience</text>
</g>
<g><title>Triage/independent reviewer uses task versions</title>
<rect x="70.0" y="950.8" width="560" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="989.8" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Triage/independent reviewer uses task versions</text>
</g>
</svg>
