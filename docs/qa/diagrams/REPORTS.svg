<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1214.8" viewBox="0 0 1160 1214.8" role="img" aria-labelledby="flowTitle flowDesc">
<title id="flowTitle">Reports capture and complete source output flow</title>
<desc id="flowDesc">Arrows show the documented workflow. Denial and missing-prerequisite branches are red.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1160" height="100%" fill="#ffffff"/>
<text x="38" y="32" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#172033">Reports capture and complete source output flow</text>
<text x="38" y="55" font-family="Arial,sans-serif" font-size="12" fill="#5e6b7d">Source-grounded flow | Current permission, version and original retry controls remain binding</text>
<path d="M 350 154 V 212" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 630.0 273.2 H 713 V 259.0 H 770.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="490.0" y="202" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>denied</title>denied</text>
<path d="M 70.0 273.2 H 40 V 552.4 H 70.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="90" y="202" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>allowed</title>allowed</text>
<path d="M 350 460.4 V 518.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="484.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>historical native episodes only</title>historical native episodes only</text>
<path d="M 350 586.4 V 644.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="610.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>human inspects metrics</title>human inspects metrics</text>
<path d="M 350 712.4 V 770.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 630.0 831.6 H 726 V 259.0 H 770.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="490.0" y="760.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>revoked/cancelled/expired</title>revoked/cancelled/expired</text>
<path d="M 70.0 831.6 H 50 V 1110.8 H 70.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="90" y="760.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>authorized</title>authorized</text>
<path d="M 70.0 678.4 H 20 V 984.8 H 70.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="90" y="634.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>unknown/recoverable</title>unknown/recoverable</text>
<path d="M 70.0 984.8 H 30 V 831.6 H 70.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="90" y="940.8" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>same intent/current authority</title>same intent/current authority</text>
<path d="M 770.0 259.0 H 726 V 120.0 H 630.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="630.0" y="208" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>deliberate reselection</title>deliberate reselection</text>
<g><title>Choose basis, period and filters</title>
