<rect x="70.0" y="950.8" width="560" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="989.8" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Record attestation/history; retire affected epochs</text>
</g>
<g><title>Opaque blocker, stale source or denial</title>
<rect x="770.0" y="218" width="340" height="82" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="1.8"/>
<text x="940" y="254.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Opaque blocker, stale source or</text>
<text x="940" y="273.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">denial</text>
</g>
<g><title>Retry exact unknown attempt or deliberately re-review</title>
<rect x="70.0" y="1076.8" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="1115.8" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Retry exact unknown attempt or deliberately re-review</text>
</g>
