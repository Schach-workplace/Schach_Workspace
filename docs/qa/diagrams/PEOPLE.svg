<rect x="70.0" y="392.4" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="431.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Capture current graph and source versions</text>
</g>
