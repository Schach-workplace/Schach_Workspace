<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1034.4" viewBox="0 0 1160 1034.4" role="img" aria-labelledby="flowTitle flowDesc">
<title id="flowTitle">Authentication and current sessions principal workflow</title>
<desc id="flowDesc">Arrows show the documented workflow. Denial and missing-prerequisite branches are red.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1160" height="100%" fill="#ffffff"/>
<text x="38" y="32" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#172033">Authentication and current sessions principal workflow</text>
<text x="38" y="55" font-family="Arial,sans-serif" font-size="12" fill="#5e6b7d">Source-grounded flow | Current permission, version and original retry controls remain binding</text>
<path d="M 350 154 V 212" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 350 280 V 338" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="304.0" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>Valid</title>Valid</text>
<path d="M 630.0 246.0 H 726 V 259.0 H 770.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="490.0" y="202" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>Invalid</title>Invalid</text>
<path d="M 350 460.4 V 518.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="484.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>Yes</title>Yes</text>
<path d="M 70.0 399.2 H 20 V 678.4 H 70.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="90" y="328" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>No</title>No</text>
<path d="M 350 586.4 V 644.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="610.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>Valid</title>Valid</text>
<path d="M 630.0 552.4 H 726 V 259.0 H 770.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="490.0" y="508.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>Invalid / consumed</title>Invalid / consumed</text>
<path d="M 350 712.4 V 770.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="736.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>Current</title>Current</text>
<path d="M 630.0 678.4 H 700 V 259.0 H 770.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="490.0" y="634.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>Revoked</title>Revoked</text>
<path d="M 350 838.4 V 896.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="862.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>Sign out</title>Sign out</text>
<path d="M 70.0 930.4 H 40 V 120.0 H 70.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<g><title>Enter provisioned credentials</title>
<rect x="70.0" y="86" width="560" height="68" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.8"/>
<text x="350" y="125.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Enter provisioned credentials</text>
</g>
<g><title>Verify password and current account</title>
<rect x="70.0" y="212" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="251.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Verify password and current account</text>
</g>
<g><title>MFA required?</title>
<polygon points="350,338 630.0,399.2 350,460.4 70.0,399.2" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
<text x="350" y="404.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">MFA required?</text>
</g>
<g><title>Verify authenticator or recovery code</title>
<rect x="70.0" y="518.4" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="557.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Verify authenticator or recovery code</text>
</g>
<g><title>Load current membership and session</title>
<rect x="70.0" y="644.4" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="683.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Load current membership and session</text>
</g>
<g><title>Open authorized workspace</title>
<rect x="70.0" y="770.4" width="560" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="809.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Open authorized workspace</text>
</g>
<g><title>Reject invalid or revoked session</title>
<rect x="770.0" y="218" width="340" height="82" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="1.8"/>
<text x="940" y="254.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Reject invalid or revoked</text>
<text x="940" y="273.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">session</text>
</g>
<g><title>Logout and revoke session</title>
<rect x="70.0" y="896.4" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="935.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Logout and revoke session</text>
</g>
</svg>
