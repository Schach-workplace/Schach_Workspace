<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1214.8" viewBox="0 0 1160 1214.8" role="img" aria-labelledby="flowTitle flowDesc">
<title id="flowTitle">Finance current authority and independent decision flow</title>
<desc id="flowDesc">Arrows show the documented workflow. Denial and missing-prerequisite branches are red.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1160" height="100%" fill="#ffffff"/>
<text x="38" y="32" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#172033">Finance current authority and independent decision flow</text>
<text x="38" y="55" font-family="Arial,sans-serif" font-size="12" fill="#5e6b7d">Source-grounded flow | Current permission, version and original retry controls remain binding</text>
<path d="M 350 154 V 212" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 350 334.4 V 392.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="358.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>allowed</title>allowed</text>
<path d="M 630.0 273.2 H 726 V 259.0 H 770.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="490.0" y="202" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>denied</title>denied</text>
<path d="M 350 460.4 V 518.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 350 586.4 V 644.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 630.0 705.6 H 713 V 259.0 H 770.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="490.0" y="634.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>self/policy/budget denied</title>self/policy/budget denied</text>
<path d="M 350 766.8 V 824.8" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="790.8" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>changed version/unknown</title>changed version/unknown</text>
<path d="M 70.0 858.8 H 50 V 705.6 H 70.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="90" y="814.8" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>current explicit review</title>current explicit review</text>
<path d="M 70.0 705.6 H 20 V 984.8 H 70.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="90" y="634.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>independent approval</title>independent approval</text>
<path d="M 350 1018.8 V 1076.8" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="1042.8" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>eligible noncreator</title>eligible noncreator</text>
<g><title>Choose company and department</title>
<rect x="70.0" y="86" width="560" height="68" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.8"/>
<text x="350" y="125.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Choose company and department</text>
</g>
<g><title>Current finance authority?</title>
<polygon points="350,212 630.0,273.2 350,334.4 70.0,273.2" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
<text x="350" y="278.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Current finance authority?</text>
</g>
