<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1214.8" viewBox="0 0 1160 1214.8" role="img" aria-labelledby="flowTitle flowDesc">
<title id="flowTitle">Current grant through self-hosted media and cleanup</title>
<desc id="flowDesc">Arrows show the documented workflow. Denial and missing-prerequisite branches are red.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1160" height="100%" fill="#ffffff"/>
<text x="38" y="32" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#172033">Current grant through self-hosted media and cleanup</text>
<text x="38" y="55" font-family="Arial,sans-serif" font-size="12" fill="#5e6b7d">Source-grounded flow | Current permission, version and original retry controls remain binding</text>
<path d="M 350 154 V 212" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="178.0" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>start/join</title>start/join</text>
<path d="M 630.0 273.2 H 713 V 259.0 H 770.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="490.0" y="202" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>not authorized</title>not authorized</text>
<path d="M 350 334.4 V 392.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="358.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>current grant</title>current grant</text>
<path d="M 350 460.4 V 518.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="484.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>actual joinedAt</title>actual joinedAt</text>
<path d="M 350 640.8 V 698.8" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="664.8" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>answered</title>answered</text>
<path d="M 70.0 579.6 H 30 V 858.8 H 70.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="90" y="508.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>unanswered after threshold</title>unanswered after threshold</text>
<path d="M 70.0 858.8 H 40 V 1110.8 H 70.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="90" y="814.8" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>durable DeleteRoom</title>durable DeleteRoom</text>
<path d="M 70.0 732.8 H 50 V 984.8 H 70.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="90" y="688.8" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>end/removal/device loss</title>end/removal/device loss</text>
<path d="M 350 1018.8 V 1076.8" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="1042.8" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>revoke plus queued cleanup</title>revoke plus queued cleanup</text>
<path d="M 630.0 984.8 H 713 V 259.0 H 770.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="490.0" y="940.8" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>cached/refreshed rejoin</title>cached/refreshed rejoin</text>
<g><title>Posting member starts or joins a call</title>
<rect x="70.0" y="86" width="560" height="68" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.8"/>
