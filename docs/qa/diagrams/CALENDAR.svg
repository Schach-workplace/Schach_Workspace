<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1034.4" viewBox="0 0 1160 1034.4" role="img" aria-labelledby="flowTitle flowDesc">
<title id="flowTitle">Calendar principal workflow</title>
<desc id="flowDesc">Arrows show the documented workflow. Denial and missing-prerequisite branches are red.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1160" height="100%" fill="#ffffff"/>
<text x="38" y="32" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#172033">Calendar principal workflow</text>
<text x="38" y="55" font-family="Arial,sans-serif" font-size="12" fill="#5e6b7d">Source-grounded flow | Current permission, version and original retry controls remain binding</text>
<path d="M 350 154 V 212" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 350 280 V 338" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 350 406 V 464" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 630.0 525.2 H 739 V 259.0 H 770.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="490.0" y="454" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>No / denied / bound</title>No / denied / bound</text>
<path d="M 770.0 259.0 H 700 V 372.0 H 630.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="630.0" y="208" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>Retry current range</title>Retry current range</text>
<path d="M 350 586.4 V 644.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="610.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>Yes</title>Yes</text>
<path d="M 350 712.4 V 770.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 350 838.4 V 896.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="862.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>Open task</title>Open task</text>
<g><title>Choose Month or Week period</title>
<rect x="70.0" y="86" width="560" height="68" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.8"/>
<text x="350" y="125.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Choose Month or Week period</text>
</g>
<g><title>Set owner, department and open-work filters</title>
<rect x="70.0" y="212" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="251.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Set owner, department and open-work filters</text>
</g>
<g><title>Request complete authorized calendar</title>
<rect x="70.0" y="338" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="377.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Request complete authorized calendar</text>
</g>
<g><title>Current complete range available?</title>
<polygon points="350,464 630.0,525.2 350,586.4 70.0,525.2" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
<text x="350" y="530.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Current complete range available?</text>
</g>
<g><title>Withhold rows/counts; expose retry</title>
<rect x="770.0" y="218" width="340" height="82" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="1.8"/>
<text x="940" y="254.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Withhold rows/counts; expose</text>
<text x="940" y="273.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">retry</text>
</g>
<g><title>Select company civil day</title>
<rect x="70.0" y="644.4" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="683.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Select company civil day</text>
</g>
<g><title>Show full authorized day agenda</title>
<rect x="70.0" y="770.4" width="560" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="809.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Show full authorized day agenda</text>
</g>
<g><title>Open currently authorized task detail</title>
<rect x="70.0" y="896.4" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="935.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Open currently authorized task detail</text>
</g>
</svg>
