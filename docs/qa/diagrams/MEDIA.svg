<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1088.8" viewBox="0 0 1160 1088.8" role="img" aria-labelledby="flowTitle flowDesc">
<title id="flowTitle">Selected bytes through scan and expiry</title>
<desc id="flowDesc">Arrows show the documented workflow. Denial and missing-prerequisite branches are red.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1160" height="100%" fill="#ffffff"/>
<text x="38" y="32" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#172033">Selected bytes through scan and expiry</text>
<text x="38" y="55" font-family="Arial,sans-serif" font-size="12" fill="#5e6b7d">Source-grounded flow | Current permission, version and original retry controls remain binding</text>
<path d="M 350 154 V 212" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="178.0" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>explicit send</title>explicit send</text>
<path d="M 350 280 V 338" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="304.0" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>configured scan</title>configured scan</text>
<path d="M 630.0 399.2 H 726 V 259.0 H 770.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="490.0" y="328" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>rejected/unavailable/lost authority</title>rejected/unavailable/lost authority</text>
<path d="M 350 460.4 V 518.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="484.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>clean and current</title>clean and current</text>
<path d="M 350 586.4 V 644.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="610.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>download</title>download</text>
<path d="M 630.0 705.6 H 713 V 259.0 H 770.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="490.0" y="634.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>denied/expired</title>denied/expired</text>
<path d="M 350 766.8 V 824.8" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="790.8" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>current eligible bytes</title>current eligible bytes</text>
<path d="M 70.0 552.4 H 50 V 984.8 H 70.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="90" y="508.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>policy expiry</title>policy expiry</text>
<path d="M 630.0 984.8 H 700 V 259.0 H 770.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="490.0" y="940.8" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>future read denied</title>future read denied</text>
<g><title>Member selects/records exact owned bytes</title>
<rect x="70.0" y="86" width="560" height="68" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.8"/>
<text x="350" y="125.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Member selects/records exact owned bytes</text>
</g>
<g><title>Server reserves hash/size and uploads privately</title>
<rect x="70.0" y="212" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="251.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Server reserves hash/size and uploads privately</text>
</g>
<g><title>Scanner checks bytes; server rechecks authority</title>
<polygon points="350,338 630.0,399.2 350,460.4 70.0,399.2" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
<text x="350" y="404.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Scanner checks bytes; server rechecks authority</text>
</g>
<g><title>Server rejects or keeps bytes inaccessible</title>
<rect x="770.0" y="218" width="340" height="82" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="1.8"/>
<text x="940" y="254.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Server rejects or keeps bytes</text>
<text x="940" y="273.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">inaccessible</text>
</g>
<g><title>Member binds clean eligible media to message</title>
<rect x="70.0" y="518.4" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="557.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Member binds clean eligible media to message</text>
</g>
<g><title>Server checks current source/history/expiry</title>
<polygon points="350,644.4 630.0,705.6 350,766.8 70.0,705.6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
<text x="350" y="710.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Server checks current source/history/expiry</text>
</g>
<g><title>Authorized reader downloads; OS copy is independent</title>
<rect x="70.0" y="824.8" width="560" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="863.8" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Authorized reader downloads; OS copy is independent</text>
</g>
<g><title>Operator expires/purges live content</title>
<rect x="70.0" y="950.8" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="989.8" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Operator expires/purges live content</text>
</g>
</svg>
