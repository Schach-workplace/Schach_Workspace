<text x="630.0" y="208" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>Refresh</title>Refresh</text>
<path d="M 350 712.4 V 770.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="736.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>Yes</title>Yes</text>
<path d="M 350 838.4 V 896.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="862.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>Optional current seed</title>Optional current seed</text>
<g><title>Set company-local planning period</title>
