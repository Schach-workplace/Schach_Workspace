<text x="360" y="358.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>authorized</title>authorized</text>
<path d="M 350 460.4 V 518.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="484.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>preview then commit</title>preview then commit</text>
<path d="M 630.0 579.6 H 700 V 259.0 H 770.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="490.0" y="508.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>stale/denied/foreign</title>stale/denied/foreign</text>
<path d="M 350 640.8 V 698.8" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="664.8" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>current allowed command</title>current allowed command</text>
<path d="M 350 766.8 V 824.8" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="790.8" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>canonical accepted result</title>canonical accepted result</text>
<path d="M 350 892.8 V 950.8" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="916.8" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>later access/source loss</title>later access/source loss</text>
<path d="M 630.0 984.8 H 700 V 259.0 H 770.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="490.0" y="940.8" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>new reads</title>new reads</text>
<path d="M 350 1018.8 V 1076.8" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="1042.8" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>already disclosed bytes/text</title>already disclosed bytes/text</text>
<g><title>Authenticated actor requests a company/source</title>
