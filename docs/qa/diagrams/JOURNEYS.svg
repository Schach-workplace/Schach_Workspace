<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1214.8" viewBox="0 0 1160 1214.8" role="img" aria-labelledby="flowTitle flowDesc">
<title id="flowTitle">Cross-module reviewed business outcome</title>
<desc id="flowDesc">Arrows show the documented workflow. Denial and missing-prerequisite branches are red.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1160" height="100%" fill="#ffffff"/>
<text x="38" y="32" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#172033">Cross-module reviewed business outcome</text>
<text x="38" y="55" font-family="Arial,sans-serif" font-size="12" fill="#5e6b7d">Source-grounded flow | Current permission, version and original retry controls remain binding</text>
<path d="M 350 154 V 212" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="178.0" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>begin</title>begin</text>
<path d="M 350 334.4 V 392.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="358.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>eligible</title>eligible</text>
<path d="M 630.0 273.2 H 726 V 259.0 H 770.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="490.0" y="202" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>missing or denied</title>missing or denied</text>
<path d="M 350 460.4 V 518.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="484.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>reviewed</title>reviewed</text>
<path d="M 350 586.4 V 644.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="610.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>result</title>result</text>
<path d="M 350 766.8 V 824.8" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="790.8" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>unknown or failed</title>unknown or failed</text>
<path d="M 70.0 858.8 H 40 V 273.2 H 70.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="90" y="814.8" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>recheck original context</title>recheck original context</text>
<path d="M 70.0 705.6 H 50 V 984.8 H 70.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="90" y="634.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>known or verified</title>known or verified</text>
<path d="M 350 1018.8 V 1076.8" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="1042.8" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>accepted or measured</title>accepted or measured</text>
<g><title>Record source and current actor</title>
<rect x="70.0" y="86" width="560" height="68" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.8"/>
<text x="350" y="125.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Record source and current actor</text>
</g>
<g><title>Check supported environment and source permissions</title>
<polygon points="350,212 630.0,273.2 350,334.4 70.0,273.2" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
<text x="350" y="278.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Check supported environment and source permissions</text>
</g>
<g><title>Inspect exact fields and responsibilities</title>
<rect x="70.0" y="392.4" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="431.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Inspect exact fields and responsibilities</text>
</g>
<g><title>Apply deliberate original canonical intent</title>
<rect x="70.0" y="518.4" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="557.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Apply deliberate original canonical intent</text>
</g>
<g><title>Acknowledgement known?</title>
<polygon points="350,644.4 630.0,705.6 350,766.8 70.0,705.6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
<text x="350" y="710.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Acknowledgement known?</text>
</g>
<g><title>Retry original key body and target</title>
<rect x="70.0" y="824.8" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="863.8" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Retry original key body and target</text>
</g>
<g><title>Independent decision or measured validation</title>
<rect x="70.0" y="950.8" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="989.8" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Independent decision or measured validation</text>
</g>
<g><title>Retain actual outcome and scoped evidence</title>
<rect x="70.0" y="1076.8" width="560" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="1115.8" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Retain actual outcome and scoped evidence</text>
</g>
<g><title>Block missing prerequisite or deny stale authority</title>
<rect x="770.0" y="218" width="340" height="82" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="1.8"/>
<text x="940" y="254.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Block missing prerequisite or</text>
<text x="940" y="273.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">deny stale authority</text>
</g>
</svg>
