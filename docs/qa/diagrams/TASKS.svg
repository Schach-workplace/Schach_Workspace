<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1214.8" viewBox="0 0 1160 1214.8" role="img" aria-labelledby="flowTitle flowDesc">
<title id="flowTitle">All tasks and task detail principal workflow</title>
<desc id="flowDesc">Arrows show the documented workflow. Denial and missing-prerequisite branches are red.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1160" height="100%" fill="#ffffff"/>
<text x="38" y="32" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#172033">All tasks and task detail principal workflow</text>
<text x="38" y="55" font-family="Arial,sans-serif" font-size="12" fill="#5e6b7d">Source-grounded flow | Current permission, version and original retry controls remain binding</text>
<path d="M 350 154 V 212" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 350 280 V 338" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 70.0 399.2 H 40 V 246.0 H 70.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="90" y="328" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>No</title>No</text>
<path d="M 350 460.4 V 518.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="484.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>Yes</title>Yes</text>
<path d="M 350 586.4 V 644.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 350 712.4 V 770.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="736.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>Current eligible reviewer</title>Current eligible reviewer</text>
<path d="M 630.0 678.4 H 726 V 259.0 H 770.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="490.0" y="634.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>Stale / denied</title>Stale / denied</text>
<path d="M 350 892.8 V 950.8" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="916.8" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>Accept</title>Accept</text>
<path d="M 70.0 831.6 H 20 V 1110.8 H 70.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="90" y="760.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>Request changes</title>Request changes</text>
<path d="M 70.0 1110.8 H 30 V 246.0 H 70.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 70.0 984.8 H 40 V 246.0 H 70.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="90" y="940.8" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>Explicit reopen</title>Explicit reopen</text>
<path d="M 770.0 259.0 H 739 V 678.4 H 630.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="630.0" y="208" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>Deliberate latest inspection</title>Deliberate latest inspection</text>
<g><title>Create exact owner, commitment and criteria</title>
<rect x="70.0" y="86" width="560" height="68" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.8"/>
<text x="350" y="125.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Create exact owner, commitment and criteria</text>
</g>
<g><title>Save progress, blockers and evidence</title>
<rect x="70.0" y="212" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="251.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Save progress, blockers and evidence</text>
</g>
<g><title>Checklist and dependencies complete?</title>
<polygon points="350,338 630.0,399.2 350,460.4 70.0,399.2" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
<text x="350" y="404.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Checklist and dependencies complete?</text>
</g>
<g><title>Owner submits In review</title>
<rect x="70.0" y="518.4" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="557.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Owner submits In review</text>
</g>
<g><title>Independent reviewer inspects current version</title>
<rect x="70.0" y="644.4" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="683.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Independent reviewer inspects current version</text>
</g>
<g><title>Accept or request changes?</title>
<polygon points="350,770.4 630.0,831.6 350,892.8 70.0,831.6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
<text x="350" y="836.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Accept or request changes?</text>
</g>
<g><title>Done with immutable acceptance history</title>
<rect x="70.0" y="950.8" width="560" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="989.8" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Done with immutable acceptance history</text>
</g>
<g><title>Return In progress with feedback</title>
<rect x="70.0" y="1076.8" width="560" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="1115.8" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Return In progress with feedback</text>
</g>
<g><title>Reject stale/denied intent; inspect or exact retry</title>
<rect x="770.0" y="218" width="340" height="82" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="1.8"/>
<text x="940" y="254.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Reject stale/denied intent;</text>
<text x="940" y="273.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">inspect or exact retry</text>
</g>
</svg>
