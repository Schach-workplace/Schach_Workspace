<rect x="70.0" y="896.4" width="560" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="935.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Show qualified current value and history</text>
</g>
<g><title>Inspect conflict or retry frozen unknown intent</title>
<rect x="770.0" y="218" width="340" height="82" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="1.8"/>
<text x="940" y="254.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Inspect conflict or retry frozen</text>
<text x="940" y="273.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">unknown intent</text>
</g>
</svg>
