<polygon points="350,590 630.0,651.2 350,712.4 70.0,651.2" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
<text x="350" y="656.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Versions and sources still current?</text>
</g>
