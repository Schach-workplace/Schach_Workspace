<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1034.4" viewBox="0 0 1160 1034.4" role="img" aria-labelledby="flowTitle flowDesc">
<title id="flowTitle">Goals and observations principal workflow</title>
<desc id="flowDesc">Arrows show the documented workflow. Denial and missing-prerequisite branches are red.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1160" height="100%" fill="#ffffff"/>
<text x="38" y="32" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#172033">Goals and observations principal workflow</text>
<text x="38" y="55" font-family="Arial,sans-serif" font-size="12" fill="#5e6b7d">Source-grounded flow | Current permission, version and original retry controls remain binding</text>
<path d="M 350 154 V 212" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 350 280 V 338" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="304.0" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>Explicit update</title>Explicit update</text>
<path d="M 350 406 V 464" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 350 532 V 590" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 350 712.4 V 770.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="736.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>Yes</title>Yes</text>
<path d="M 630.0 651.2 H 713 V 259.0 H 770.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="490.0" y="580" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>Conflict / denial</title>Conflict / denial</text>
<path d="M 350 838.4 V 896.4" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="862.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>Known ACK</title>Known ACK</text>
<path d="M 630.0 804.4 H 739 V 259.0 H 770.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="490.0" y="760.4" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>ACK unknown</title>ACK unknown</text>
<path d="M 770.0 259.0 H 700 V 651.2 H 630.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="630.0" y="208" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>Exact unknown retry</title>Exact unknown retry</text>
<path d="M 770.0 259.0 H 713 V 120.0 H 630.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="630.0" y="208" font-family="Arial,sans-serif" font-size="11" fill="#475569"><title>Deliberate discard and latest load</title>Deliberate discard and latest load</text>
<g><title>Open current authorized goal</title>
<rect x="70.0" y="86" width="560" height="68" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.8"/>
<text x="350" y="125.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Open current authorized goal</text>
</g>
<g><title>Review metadata and contributing tasks</title>
<rect x="70.0" y="212" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="251.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Review metadata and contributing tasks</text>
</g>
<g><title>Enter value, instant and reason</title>
<rect x="70.0" y="338" width="560" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="350" y="377.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Enter value, instant and reason</text>
</g>
