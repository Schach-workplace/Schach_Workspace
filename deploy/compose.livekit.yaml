# Merge with ../compose.yaml from the repository root. Provider signaling has
# no published port. Supply a private deploy/livekit.yaml from the example.
services:
  app:
    environment:
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Configure the matching provider key}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Configure a unique provider secret}
  livekit:
    image: livekit/livekit-server@sha256:d0c04791bf63ca8dcea123571827d56ba9504bd57c8d5de60ee03b5408cc3154
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
    restart: unless-stopped
